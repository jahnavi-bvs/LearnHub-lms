server:
  port: 8081

spring:
  application:
    name: auth-service

  # Loads DB_USERNAME / DB_PASSWORD (and later JWT_SECRET) from your local secrets file.
  # Real environment variables, if set, take priority over this file.
  config:
    import:
      - optional:file:./local-secrets.properties
      - optional:file:../local-secrets.properties
      - optional:file:./backend/local-secrets.properties   # when run from the project root folder (IntelliJ)

  datasource:
    url: jdbc:mysql://localhost:3306/learnhub_auth
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update      # Hibernate creates/updates tables from @Entity classes
    open-in-view: false     # don't keep DB connections open for the whole web request
    show-sql: true          # print SQL in the console (handy while learning)
    properties:
      hibernate:
        format_sql: true

# Our own settings, bound to the JwtProperties record
learnhub:
  jwt:
    secret: ${JWT_SECRET}      # from local-secrets.properties - never hardcode it
    issuer: learnhub-auth      # written into every token as "iss" and checked when verifying
    expiration: 1h             # how long a token stays valid (java.time.Duration format)
  # The first admin account, created at startup if this email isn't registered yet.
  # Leave ADMIN_PASSWORD out of local-secrets.properties and no account is created.
  admin:
    email: admin@learnhub.com
    password: ${ADMIN_PASSWORD:}
