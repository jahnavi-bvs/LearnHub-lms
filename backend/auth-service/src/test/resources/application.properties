# Test-only overrides. Spring Boot loads this together with application.yaml, and .properties
# wins for the same key - so tests use a separate database and never touch your dev data.
spring.datasource.url=jdbc:mysql://localhost:3306/learnhub_auth_test
# Tests never create the real admin account, even when ADMIN_PASSWORD is in local-secrets.properties
learnhub.admin.password=
# Less console noise while tests run
spring.jpa.show-sql=false
